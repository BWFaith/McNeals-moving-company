<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>
      Gallery | McNeal's Moving &amp; Logistics, Nashville
      TN
    </title>
    <meta
      name="description"
      content="See photos of past moving, packing and TV mounting jobs by McNeal's Moving & Logistics."
    />
    <link
      rel="icon"
      href="assets/img/logo.jpg"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="css/style.css"
    />
  </head>
  <body
    data-page="gallery"
    data-title="Gallery"
    data-sub="See photos of past moving, packing and TV mounting jobs by McNeal's Moving & Logistics."
  >
    <main>
      <section class="sec">
        <div class="wrap">
          <div class="center">
            <h2>Our work, up close</h2>
            <p class="lead">
              Drag the sliders to compare before and after,
              or filter the photo wall. Replace the
              placeholders with your own photos.
            </p>
          </div>
          <div class="grid g2">
            <div class="ba">
              <img
                src="assets/img/ba1-after.svg"
                alt="After"
              />
              <div class="bf">
                <img
                  src="assets/img/ba1-before.svg"
                  alt="Before"
                />
              </div>
              <div class="ln"></div>
              <i>Before</i><i>After</i
              ><input
                type="range"
                min="0"
                max="100"
                value="50"
                aria-label="Compare"
              />
            </div>
            <div class="ba">
              <img
                src="assets/img/ba2-after.svg"
                alt="After"
              />
              <div class="bf">
                <img
                  src="assets/img/ba2-before.svg"
                  alt="Before"
                />
              </div>
              <div class="ln"></div>
              <i>Before</i><i>After</i
              ><input
                type="range"
                min="0"
                max="100"
                value="50"
                aria-label="Compare"
              />
            </div>
          </div>
          <div class="filters">
            <button
              class="on"
              data-f="all"
            >
              All</button
            ><button data-f="home">Homes</button
            ><button data-f="office">Offices</button
            ><button data-f="pack">Packing</button
            ><button data-f="tv">TV mounting</button
            ><button data-f="storage">Storage</button>
          </div>
          <div class="gal">
            <figure data-c="home">
              <img
                src="assets/img/g1.svg"
                alt="Family home move"
                loading="lazy"
              />
              <figcaption>Family home move</figcaption>
            </figure>
            <figure data-c="office">
              <img
                src="assets/img/g2.svg"
                alt="Office relocation"
                loading="lazy"
              />
              <figcaption>Office relocation</figcaption>
            </figure>
            <figure data-c="pack">
              <img
                src="assets/img/g3.svg"
                alt="Packing day"
                loading="lazy"
              />
              <figcaption>Packing day</figcaption>
            </figure>
            <figure data-c="tv">
              <img
                src="assets/img/g4.svg"
                alt="TV wall mount"
                loading="lazy"
              />
              <figcaption>TV wall mount</figcaption>
            </figure>
            <figure data-c="storage">
              <img
                src="assets/img/g5.svg"
                alt="Storage unit move"
                loading="lazy"
              />
              <figcaption>Storage unit move</figcaption>
            </figure>
            <figure data-c="home">
              <img
                src="assets/img/g6.svg"
                alt="Apartment move"
                loading="lazy"
              />
              <figcaption>Apartment move</figcaption>
            </figure>
            <figure data-c="pack">
              <img
                src="assets/img/g7.svg"
                alt="Wrapped furniture"
                loading="lazy"
              />
              <figcaption>Wrapped furniture</figcaption>
            </figure>
            <figure data-c="office">
              <img
                src="assets/img/g8.svg"
                alt="Suite move"
                loading="lazy"
              />
              <figcaption>Suite move</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
