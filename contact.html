<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>
      Contact | McNeal's Moving &amp; Logistics, Nashville
      TN
    </title>
    <meta
      name="description"
      content="Call, text or email McNeal's Moving & Logistics for a free estimate in Nashville and Middle Tennessee."
    />
    <link
      rel="icon"
      href="assets/img/logo.jpg"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="css/style.css"
    />
  </head>
  <body
    data-page="contact"
    data-title="Contact"
    data-sub="Call, text or email McNeal's Moving & Logistics for a free estimate in Nashville and Middle Tennessee."
  >
    <main>
      <section class="sec">
        <div
          class="wrap bk"
          style="grid-template-columns: 1fr 1.3fr"
        >
          <div class="rv">
            <h2>Let's talk about your move</h2>
            <div class="ct">
              <i>&#9990;</i>
              <div>
                <b>Call or text</b
                ><a href="tel:+19312623995">931-262-3995</a>
              </div>
            </div>
            <div class="ct">
              <i>&#9993;</i>
              <div>
                <b>Email</b
                ><a href="mailto:Mcnealonthemove@gmail.com"
                  >Mcnealonthemove@gmail.com</a
                >
              </div>
            </div>
            <div class="ct">
              <i>&#9906;</i>
              <div>
                <b>Service area</b>Nashville, Murfreesboro,
                Smyrna, La Vergne, Clarksville
              </div>
            </div>
            <a
              class="btn btn-dk"
              href="booking.html"
              >Get an instant quote</a
            >
          </div>
          <div class="form rv">
            <form
              id="cf"
              novalidate
            >
              <div class="fg">
                <div>
                  <label>Name</label
                  ><input
                    name="name"
                    required
                  />
                </div>
                <div>
                  <label>Email</label
                  ><input
                    type="email"
                    name="email"
                    required
                  />
                </div>
                <div>
                  <label>Phone</label
                  ><input
                    type="tel"
                    name="phone"
                  />
                </div>
                <div>
                  <label>Subject</label
                  ><input
                    name="subject"
                    required
                  />
                </div>
              </div>
              <label>Message</label
              ><textarea
                name="message"
                rows="5"
                required
              ></textarea
              ><button
                class="btn btn-gold"
                type="submit"
                style="margin-top: 18px"
              >
                Send message
              </button>
              <p class="msg"></p>
            </form>
          </div>
        </div>
        <div class="wrap">
          <iframe
            class="map"
            title="Map"
            loading="lazy"
            src="https://www.google.com/maps?q=Nashville,TN&output=embed"
          ></iframe>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
