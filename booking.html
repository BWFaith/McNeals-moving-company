<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>
      Book &amp; Get a Quote | McNeal's Moving &amp;
      Logistics, Nashville TN
    </title>
    <meta
      name="description"
      content="Build an instant moving estimate and book your date with McNeal's Moving & Logistics."
    />
    <link
      rel="icon"
      href="assets/img/logo.jpg"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="css/style.css"
    />
  </head>
  <body
    data-page="booking"
    data-title="Book &amp; Get a Quote"
    data-sub="Build an instant moving estimate and book your date with McNeal's Moving & Logistics."
  >
    <main>
      <section class="sec">
        <div class="wrap bk">
          <div>
            <div class="form">
              <form
                id="qf"
                onsubmit="return false;"
              >
                <h3>1. Build your quote</h3>
                <div class="fg">
                  <div>
                    <label>Service</label
                    ><select name="service">
                      <option value="res">
                        Residential moving
                      </option>
                      <option value="commercial">
                        Commercial relocation
                      </option>
                      <option value="long">
                        Long-distance move
                      </option>
                      <option value="labor">
                        Labor only (no truck)
                      </option>
                    </select>
                  </div>
                  <div>
                    <label>Size of move</label
                    ><select name="size">
                      <option data-h="2">
                        Studio / 1 bedroom
                      </option>
                      <option
                        data-h="3.5"
                        selected
                      >
                        2 bedrooms
                      </option>
                      <option data-h="5">3 bedrooms</option>
                      <option data-h="7">4 bedrooms</option>
                      <option data-h="9">
                        5+ bedrooms
                      </option>
                      <option data-h="3">
                        Small office
                      </option>
                      <option data-h="6">
                        Medium office
                      </option>
                      <option data-h="9">
                        Large office
                      </option>
                    </select>
                  </div>
                </div>
                <label>Crew size</label>
                <div
                  class="opts"
                  style="margin-bottom: 18px"
                >
                  <label
                    ><input
                      type="radio"
                      name="crew"
                      value="2"
                      checked
                    /><span>2 movers</span></label
                  ><label
                    ><input
                      type="radio"
                      name="crew"
                      value="3"
                    /><span>3 movers</span></label
                  ><label
                    ><input
                      type="radio"
                      name="crew"
                      value="4"
                    /><span>4 movers</span></label
                  >
                </div>
                <div class="fg">
                  <div>
                    <label
                      >Distance:
                      <span id="mv">10 mi</span></label
                    ><input
                      type="range"
                      name="miles"
                      min="0"
                      max="300"
                      step="5"
                      value="10"
                    />
                  </div>
                  <div>
                    <label>Flights of stairs</label
                    ><input
                      type="number"
                      name="stairs"
                      min="0"
                      max="10"
                      value="0"
                    />
                  </div>
                  <div>
                    <label>TVs to mount</label
                    ><input
                      type="number"
                      name="tv"
                      min="0"
                      max="10"
                      value="0"
                    />
                  </div>
                </div>
                <div class="fg">
                  <label class="chk"
                    ><input
                      type="checkbox"
                      name="packing"
                    />Packing service</label
                  ><label class="chk"
                    ><input
                      type="checkbox"
                      name="wrap"
                    />Furniture wrap and disassembly</label
                  ><label class="chk"
                    ><input
                      type="checkbox"
                      name="heavy"
                    />Heavy or specialty item</label
                  ><label class="chk"
                    ><input
                      type="checkbox"
                      name="storage"
                    />Storage unit pickup</label
                  >
                </div>
              </form>
            </div>
            <div
              class="form"
              style="margin-top: 26px"
            >
              <form
                id="bf"
                novalidate
              >
                <h3>2. Book your date</h3>
                <div class="fg">
                  <div>
                    <label>Full name</label
                    ><input
                      name="name"
                      required
                      autocomplete="name"
                    />
                  </div>
                  <div>
                    <label
                      >Email (we send your quote
                      here)</label
                    ><input
                      type="email"
                      name="email"
                      required
                      autocomplete="email"
                    />
                  </div>
                  <div>
                    <label>Phone</label
                    ><input
                      type="tel"
                      name="phone"
                      required
                      autocomplete="tel"
                    />
                  </div>
                  <div>
                    <label>Preferred date</label
                    ><input
                      type="date"
                      name="date"
                      form="bf"
                      required
                    />
                  </div>
                  <div>
                    <label>Arrival window</label
                    ><select name="time">
                      <option>Morning (8-12)</option>
                      <option>Afternoon (12-4)</option>
                      <option>Evening (4-7)</option>
                    </select>
                  </div>
                </div>
                <div class="fg">
                  <div>
                    <label>Moving from</label
                    ><input
                      name="from"
                      required
                    />
                  </div>
                  <div>
                    <label>Moving to</label
                    ><input
                      name="to"
                      required
                    />
                  </div>
                </div>
                <label>Notes</label
                ><textarea
                  name="notes"
                  rows="3"
                  placeholder="Stairs, parking, special items..."
                ></textarea
                ><button
                  class="btn btn-gold"
                  type="submit"
                  style="margin-top: 18px"
                >
                  Book and email my quote
                </button>
                <p class="msg"></p>
              </form>
            </div>
          </div>
          <aside class="sum">
            <h3>Your estimate</h3>
            <ul id="sl"></ul>
            <div class="tot">
              <span>Estimated total</span><b id="tt">$0</b>
            </div>
            <small id="rg"></small
            ><small
              >Final price is confirmed after we review
              access and inventory. A copy goes to you and
              to McNeal's.</small
            >
          </aside>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
